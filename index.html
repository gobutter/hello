<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>데스크 버디 초대장 🎁</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://gobutter.github.io/hello/">
<meta property="og:title" content="데스크 버디 초대장이 왔어요 🎁">
<meta property="og:description" content="내 바탕화면에 친구 캐릭터가 놀러 와요! 같이 시작하면 둘 다 젤리 100개 🍬">
<meta property="og:image" content="https://gobutter.github.io/hello/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
:root{--ink:#2b2b3a;--muted:#757a96;--accent:#6d5dfc;--pink:#ff5fa2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(170deg,#ece9ff,#fdf2ff);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink)}
.card{width:100%;max-width:360px;background:#fff;border:3px solid var(--ink);border-radius:30px;box-shadow:0 5px 0 var(--ink);padding:26px 22px 22px;text-align:center}
.tag{display:inline-block;font-size:13px;font-weight:900;color:var(--pink);background:#ffe3f1;border-radius:99px;padding:3px 12px}
.ch{font-size:76px;line-height:1;margin:14px 0 6px}
h1{margin:0;font-size:23px}
p{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:14px;line-height:1.5}
.code{margin:16px auto 2px;display:inline-block;border:2.5px dashed var(--accent);border-radius:12px;padding:4px 16px;font-weight:900;letter-spacing:5px;color:var(--accent);font-size:24px}
.hint{font-size:12px;color:var(--muted);font-weight:700}
.btn{display:block;width:100%;margin-top:12px;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:13px;font:inherit;font-weight:900;font-size:16px;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.go{background:#ff8fc0}.open{background:#fff;font-size:14px;padding:10px}
.done{display:none;margin-top:10px;background:#c9f5da;border-radius:12px;padding:9px;font-size:13px;font-weight:800;line-height:1.5}
.small{margin-top:12px;font-size:12px;color:#9a9fb8;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <span class="tag">🎁 초대장이 도착했어요</span>
  <div class="ch">🧸</div>
  <h1 id="who">친구가 같이 하재요!</h1>
  <p>데스크 버디를 설치하고<br>아래 초대 코드를 넣으면 바로 친구가 돼요</p>
  <div class="code" id="code">······</div>
  <div class="hint">둘 다 젤리 100개 🍬</div>
  <button class="btn go" id="go">📥 초대 코드 복사하고 설치하기</button>
  <div class="done" id="done">초대 코드를 복사했어요!<br>설치하고 캐릭터를 만들면 코드가 자동으로 들어가요 ✨</div>
  <a class="btn open" id="open" href="#">이미 설치했어요 → 앱에서 열기</a>
  <div class="small">Windows 10 · 11 PC용 · 무료</div>
</div>
<script>
// 링크: ?n=초대한 사람 이름&c=초대 코드&d=설치 파일(구글 드라이브) id
const q = new URLSearchParams(location.search);
const name = (q.get("n") || "").slice(0, 20), code = (q.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6), drive = (q.get("d") || "").replace(/[^\w-]/g, "");
// 받침 있으면 "윤정이", 없으면 "지수가"
const josa = n => { const c = n.charCodeAt(n.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? "이" : "가"; };
if (name) { document.getElementById("who").textContent = `${name}${josa(name)} 같이 하재요!`; document.title = `${name}${josa(name)} 보낸 데스크 버디 초대장 🎁`; }
if (code) document.getElementById("code").textContent = code;
document.getElementById("open").href = code ? `deskbuddy://add/${code}` : "deskbuddy://";
document.getElementById("go").onclick = async () => {
  if (code) { try { await navigator.clipboard.writeText(`데스크 버디 초대 코드 ${code}`); } catch (e) {} document.getElementById("done").style.display = "block"; }
  if (drive) location.href = `https://drive.usercontent.google.com/download?id=${drive}&export=download&confirm=t`;
};
</script>
</body>
</html>
